name: Accuracy gates

on:
  push:
    branches: [ master ]
    paths:
      - 'stem-model/**'
      - '.github/workflows/ci-accuracy.yml'
  pull_request:
    paths:
      - 'stem-model/**'
      - '.github/workflows/ci-accuracy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accuracy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Full gate
    runs-on: ubuntu-24.04
    env:
      UV_TORCH_BACKEND: cpu
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: stem-model/Makefile
      - name: Install the ARM cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libnewlib-dev

      # The checkpoint is derived from these files and nothing else, so the key
      # is exactly "would the dataset or the model come out different?".
      - name: Checkpoint key
        id: checkpoint-key
        run: |
          hash=$(cat stem-model/relations.py stem-model/surface.py \
                     stem-model/distractors.py stem-model/gen_traces.py \
                     stem-model/make_dataset.py stem-model/tokenizer.py \
                     stem-model/train.py stem-model/export_model.py \
                     stem-model/export_int8.py stem-model/Makefile \
                  | sha256sum | cut -d' ' -f1)
          echo "key=checkpoint-$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the checkpoint
        id: checkpoint
        uses: actions/cache@v5
        with:
          key: ${{ steps.checkpoint-key.outputs.key }}
          path: |
            stem-model/weights.bin
            stem-model/ref.npy
            stem-model/data/tokenizer.json
            stem-model/data/held_out.jsonl

      # A miss means the pipeline itself changed, which is exactly when the
      # numbers need recomputing. Roughly 25 minutes; the cached path is two.
      - name: Build the dataset and model
        if: steps.checkpoint.outputs.cache-hit != 'true'
        working-directory: stem-model
        run: make all

      # Runs before any export can rewrite bpe.h, so a stale committed header
      # is caught rather than silently regenerated.
      - name: Committed tokenizer header matches the checkpoint
        working-directory: stem-model
        run: uv run --with sympy python check_tokenizer_sync.py

      - name: Export the weights
        if: steps.checkpoint.outputs.cache-hit != 'true'
        working-directory: stem-model
        run: make export

      - name: Full gate
        run: sh stem-model/gate.sh
